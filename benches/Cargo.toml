[package]
name = "dnsbox-bench"
version = "0.0.0"
publish = false
edition = "2024"
description = "Criterion benchmarks comparing dnsbox with hickory-proto and domain"
license = "MIT"

# A separate package and workspace on purpose: criterion, hickory-proto and
# domain have their own MSRVs and dependency trees, none of which may leak
# into the dnsbox crate. Run from this directory with `cargo bench`.
[workspace]

[dependencies]
dnsbox = { path = ".." }
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
domain = { version = "0.12", default-features = false, features = ["std"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[lib]
name = "dnsbox_bench"
path = "src/lib.rs"
bench = false

[[bench]]
name = "compare"
harness = false

[profile.bench]
debug = false
lto = "thin"
codegen-units = 1
