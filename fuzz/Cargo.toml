[package]
name = "dnsbox-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
description = "cargo-fuzz targets for dnsbox"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
dnsbox = { path = ".." }

# `src/lib.rs` is also compiled into dnsbox's own tests, where `alloc` means
# dnsbox's feature; here it is always on (dnsbox's default features).
[features]
default = ["alloc"]
alloc = []

# Not part of any other workspace: this crate needs nightly and libFuzzer.
[workspace]
members = ["."]

[profile.release]
debug = 1

[lib]
name = "dnsbox_fuzz"
path = "src/lib.rs"
test = false
doc = false

[[bin]]
name = "edns"
path = "fuzz_targets/edns.rs"
test = false
doc = false
bench = false

[[bin]]
name = "message"
path = "fuzz_targets/message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "name"
path = "fuzz_targets/name.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rdata"
path = "fuzz_targets/rdata.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "text"
path = "fuzz_targets/text.rs"
test = false
doc = false
bench = false
