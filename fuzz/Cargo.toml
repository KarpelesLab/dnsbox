[package]
name = "dnsbox-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
description = "cargo-fuzz targets for dnsbox"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
dnsbox = { path = ".." }

# `src/lib.rs` is also compiled into dnsbox's own tests, where `alloc`,
# `dnssec`, `dnssec-digest` and `tsig` mean dnsbox's features; here they are
# always on.
[features]
default = ["alloc", "dnssec", "tsig"]
alloc = []
dnssec-digest = ["dnsbox/dnssec-digest"]
dnssec = ["alloc", "dnssec-digest", "dnsbox/dnssec"]
tsig = ["dnsbox/tsig"]

# Not part of any other workspace: this crate needs nightly and libFuzzer.
[workspace]
members = ["."]

[profile.release]
debug = 1

[lib]
name = "dnsbox_fuzz"
path = "src/lib.rs"
test = false
doc = false

[[bin]]
name = "edns"
path = "fuzz_targets/edns.rs"
test = false
doc = false
bench = false

[[bin]]
name = "message"
path = "fuzz_targets/message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "name"
path = "fuzz_targets/name.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rdata"
path = "fuzz_targets/rdata.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "text"
path = "fuzz_targets/text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "denial"
path = "fuzz_targets/denial.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dnssec"
path = "fuzz_targets/dnssec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sign"
path = "fuzz_targets/sign.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zone"
path = "fuzz_targets/zone.rs"
test = false
doc = false
bench = false
