[package]
name          = "dnsbox"
version       = "0.0.2"
edition       = "2024"
rust-version  = "1.89"
description   = "High-performance, zero-copy DNS message parsing and building for requests and responses, with broad RFC extension coverage."
license       = "MIT"
repository    = "https://github.com/KarpelesLab/dnsbox"
documentation = "https://docs.rs/dnsbox"
readme        = "README.md"
keywords      = ["dns", "parser", "protocol", "no_std", "zero-copy"]
categories    = ["network-programming", "parser-implementations", "encoding", "no-std"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std"]
# Heap-backed conveniences: owned record types, growable message builders.
alloc = ["serde?/alloc"]
# `std::io` integration (TCP message reading/writing, `$INCLUDE` from the
# file system). Pulls in `alloc`. (The error types implement
# `core::error::Error` without it.)
std   = ["alloc"]
# DNSSEC digests (DS digests, NSEC3 hashing) through purecrypto; no_std, no alloc.
dnssec-digest = ["dep:purecrypto", "purecrypto/hash"]
# DNSSEC signatures (RSA, ECDSA P-256/P-384, Ed25519, Ed448) through purecrypto:
# RRSIG verification and signing. Needs `alloc` for RSA and P-384 arithmetic.
dnssec = ["alloc", "dnssec-digest", "purecrypto/alloc", "purecrypto/rsa", "purecrypto/ec"]
# RFC 9018 interoperable DNS server cookies (SipHash-2-4 from purecrypto).
cookie-siphash = ["dep:purecrypto", "purecrypto/mac"]
# TSIG (RFC 8945) HMAC backend: HMAC-MD5/SHA-1/SHA-224/SHA-256/SHA-384/SHA-512
# from purecrypto. The TSIG wire format, MAC input construction and the
# pluggable `TsigKey`/`TsigMac` traits work without it.
tsig = ["dep:purecrypto", "purecrypto/hash"]
# TKEY (RFC 2930) key agreement producing TSIG keys: Diffie-Hellman exchanged
# keying (RFC 2539 groups, MD5 mixing) and RSA-encrypted server/resolver
# assigned keying, from purecrypto. The TKEY messages, the deletion mode and the
# RFC 2539 KEY format work without it. Implies `alloc` and `tsig`.
tkey = ["alloc", "tsig", "dep:purecrypto", "purecrypto/alloc", "purecrypto/hash", "purecrypto/dh", "purecrypto/rsa"]
# serde Serialize/Deserialize (no_std) for the protocol-number newtypes, names,
# header flags and, with `alloc`, the owned message types.
serde = ["dep:serde"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# Every fallible public function documents its errors, and nothing in the
# library may panic (CI denies warnings).
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[dependencies]
# Cryptographic primitives (digests, HMAC, signatures) for DNSSEC, TSIG and
# friends. Optional: dnsbox never implements crypto itself, and the wire-format
# logic works without it. Features that need it enable the purecrypto
# sub-features they use (e.g. `purecrypto/hash`).
purecrypto = { version = "0.9", default-features = false, optional = true }
# Optional serde support (feature `serde`); no_std, `alloc` enabled with ours.
serde = { version = "1.0.200", default-features = false, features = ["derive"], optional = true }

[dev-dependencies]
# Signature verification of real SIG(0) captures in tests (Ed25519, ECDSA
# P-256, RSA/SHA-256); never a dependency of the library itself.
purecrypto = { version = "0.9", default-features = false, features = ["hash", "ec", "rsa", "alloc"] }
# Property tests (tests/proptest_roundtrip.rs). Without default features
# only the generators and runner are built, which keeps MSRV 1.89.
proptest = { version = "1.5", default-features = false, features = ["std"] }
# Allocation-free hot path check (tests/no_alloc.rs): a global allocator that
# counts allocations made while a closure runs.
assert_no_alloc = { version = "1.1", default-features = false, features = ["warn_debug", "warn_release"] }
# serde round-trip tests of the `serde` feature (JSON is human-readable).
serde_json = "1"
# Token-level checks of both serde forms (readable and compact).
serde_test = "1"

# Example programs (`examples/`); see the crate docs' "Examples" section.
[[example]]
name = "stub_resolver"
required-features = ["std"]

[[example]]
name = "zone2wire"
required-features = ["std"]

[[example]]
name = "dnssec_dig"
required-features = ["dnssec"]

[[example]]
name = "tsig_axfr"
required-features = ["std", "tsig"]

[[example]]
name = "interop_probe"
required-features = ["std", "tsig", "dnssec"]
